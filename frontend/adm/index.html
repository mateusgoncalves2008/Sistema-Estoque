
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Responsável | Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div>
                <p class="subtitulo">SISTEMA DE ESTOQUE ESCOLAR</p>
                <h1>Cadastrar responsável</h1>
                <p>Vincule um responsável a um setor da escola.</p>
            </div>
            <a class="link-voltar" href="/index.html">Voltar ao início</a>
        </header>

        <section class="cartao">
            <h2>Dados da conta</h2>

            <form id="formCadastro">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text"
                    autocomplete="name" required maxlength="150">

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email"
                    autocomplete="email" required maxlength="254">

                <label for="setorID">Setor sob responsabilidade</label>
                <select id="setorID" name="setorID" required>
                    <option value="">Carregando setores...</option>
                </select>

                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password"
                    autocomplete="new-password" minlength="12"
                    maxlength="128" required>
                <small>A senha deve ter entre 12 e 128 caracteres.</small>

                <label for="confirmacaoSenha">Confirmar senha</label>
                <input id="confirmacaoSenha" name="confirmacaoSenha"
                    type="password" autocomplete="new-password"
                    minlength="12" maxlength="128" required>

                <button id="btnCadastrar" type="submit">
                    Cadastrar responsável
                </button>

                <p id="mensagem" class="mensagem" role="status"
                    aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
