<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>E.E. Hauy Petruceli Mayrink</title>

        <link rel="preload" as="image" href="../img/emblema-escolar-educação-constrói.png" fetchpriority="high" />
        <link rel="preload" as="image" href="../img/fundo-grande.png" fetchpriority="high" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/icons/lucide.css" />
        <link rel="stylesheet" href="./aluno.css" />
        <link rel="stylesheet" href="../carregamento-global.css" />
        <script src="/lucide/lucide.min.js" defer></script>
    </head>

    <body>
        <div id="tela-carregamento-global" role="status" aria-label="Carregando o painel do aluno" aria-live="polite">
            <img
                class="logo-carregamento-global"
                src="../img/emblema-escolar-educação-constrói.png"
                alt="Logo da escola"
            />
            <p id="texto-carregamento-global" class="texto-carregamento-global">Preparando o painel do aluno...</p>
            <div class="barra-carregamento-global" role="progressbar" aria-label="Carregando dados" aria-valuetext="Carregamento em andamento"></div>
        </div>

        <div class="app-shell">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-top">
                    <div class="school-brand">
                        <div class="logo-box">
                            <img
                                src="../img/logo_cor.png"
                                alt="Logo da E.E. Hauy Petruceli Mayrink"
                            />
                        </div>

                        <div class="school-name">
                            <strong>Hauy Petruceli</strong>
                            <span>Mayrink</span>
                        </div>
                    </div>

                    <button
                        type="button"
                        class="sidebar-toggle"
                        id="btnSidebarToggle"
                        aria-label="Recolher menu"
                        title="Recolher menu"
                    >
                        <i data-lucide="panel-left-close"></i>
                    </button>
                </div>

                <nav class="sidebar-nav" id="nav"></nav>

                <div class="sidebar-bottom">
                    <div class="user-mini">
                        <div class="user-avatar" id="userAvatar">A</div>
                        <div class="user-mini-info">
                            <strong id="sidebarUserName">Aluno</strong>
                            <span>Aluno</span>
                        </div>
                    </div>

                    <button type="button" class="logout-btn" id="logoutBtn">
                        <i data-lucide="log-out"></i>
                        <span>Sair</span>
                    </button>
                </div>
            </aside>

            <div class="mobile-overlay" id="mobileOverlay"></div>

            <main class="main-content">
                <header class="mobile-topbar">
                    <button
                        type="button"
                        class="mobile-menu-btn"
                        id="mobileMenuBtn"
                        aria-label="Abrir menu"
                    >
                        <i data-lucide="menu"></i>
                    </button>

                    <div class="mobile-brand">
                        <img src="../img/logo_cor.png" alt="" />
                        <span>Hauy Petruceli Mayrink</span>
                    </div>
                </header>

                <div class="page-wrap" id="pageContent"></div>
            </main>
        </div>

        <div class="toast" id="toast"></div>
        <script src="../carregamento-global.js"></script>
        <script src="./aluno.js"></script>
    </body>
</html>
