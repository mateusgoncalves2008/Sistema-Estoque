<head>

    <link rel="stylesheet" href="./aluno.css">
</head>

<body>

<div class="app">

    <!-- BARRA LATERAL -->
    <aside id="sidebar">

        <div class="sidebar-top">

                    <img
                        src="../img/logo-_cor.png"
                        alt="Logo da E.E. Hauy Petruceli Mayrink"

                </div>

                <div class="brand-text">
                    <strong>Hauy Petruceli</strong>
                    <span>Mayrink</span>
                </div>

            </div>

            <button
                id="toggleSidebar"
                class="toggle-sidebar"
                type="button"
                aria-label="Recolher menu"
                title="Recolher menu"
            >
                <span></span>
                <span></span>
            </button>

        </div>

        <nav id="nav" class="sidebar-nav"></nav>

        <div class="sidebar-bottom">

            <div class="user-mini">

                <div id="avatarInicial" class="avatar">

                <div class="user-mini-info">
                    <strong id="sidebarNome">Aluno</strong>
                    <span>Aluno</span>
                </div>

            </div>

            <button
                id="logoutButton"
                class="logout-button"

            <div class="mobile-brand">
                <img
                    src="../img/logo-_cor.png"
                    alt="Logo"
                >

                <span>Painel do Aluno</span>
            </div>

        </div>

        <div class="page-container" id="v"></div>

    </main>

</div>


<!-- OVERLAY MOBILE -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<script src="./aluno.js"></script>

</body>
</html>
